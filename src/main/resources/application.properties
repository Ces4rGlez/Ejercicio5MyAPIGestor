spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:10000}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/dbgestor}
spring.datasource.username=${DB_USERNAME:gestor}
spring.datasource.password=${DB_PASSWORD:gestor_dev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.use-new-id-generator-mappings=false
